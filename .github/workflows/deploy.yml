name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  EMSDK_VERSION: 4.0.10
  MODELS_DIR: ${{ github.workspace }}/models

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy

      # Checkpoints are downloaded and quantized in CI, never committed.
      - name: Cache exported models
        id: models
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('tools/export.py') }}

      - name: Download and export models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p models/src
          cd models/src
          HF=https://huggingface.co/karpathy/tinyllamas/resolve/main
          curl -fsSL -o stories15M.bin   $HF/stories15M.bin
          curl -fsSL -o stories260K.bin  $HF/stories260K/stories260K.bin
          curl -fsSL -o tok512.bin       $HF/stories260K/tok512.bin
          curl -fsSL -o tokenizer.bin    https://raw.githubusercontent.com/karpathy/llama2.c/master/tokenizer.bin
          cd ../..
          python tools/export.py --bin models/src/stories15M.bin  --tokenizer models/src/tokenizer.bin -o models/stories15M.tlm
          python tools/export.py --bin models/src/stories260K.bin --tokenizer models/src/tok512.bin   -o models/stories260K.tlm
          rm -rf models/src

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: Build engine, run unit tests, build WASM
        run: tools/build.sh

      - name: Golden output test (native int8 vs known stories15M output)
        env:
          TLM_MODEL: models/stories15M.tlm
          TLM_GOLDEN: ", there was a little girl named Lily"
        run: engine/build/tlm-tests

      - name: Benchmark
        run: engine/build/tlm-bench models/stories15M.tlm

      - name: WASM smoke test (scalar + SIMD under Node)
        run: node engine/tests/wasm_smoke.mjs engine/build-wasm models/stories15M.tlm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        working-directory: site
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
